<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoalMine Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        main::-webkit-scrollbar { height: 4px; }
        main::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        table { border-spacing: 0; width: 100%; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">

    <!-- Üst Başlık -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 text-center">
        <h1 class="text-lg font-bold tracking-wider text-white">GoalMine</h1>
        <p class="text-[10px] text-gray-400">Analytics & Live Odds</p>
    </header>

    <!-- Ana İçerik / Tablo Alanı -->
    <main class="flex-1 overflow-x-auto p-1">
        <div class="inline-block min-w-full align-middle">
            <div id="loading" class="text-center py-12 text-gray-400 text-xs">Maç verileri yükleniyor...</div>
            
            <table id="matchTable" class="min-w-full text-[11px] text-center border-collapse hidden">
                <thead>
                    <tr class="bg-gray-800 text-gray-300 border-b border-gray-700">
                        <th class="p-2 text-left">EV SAHİBİ</th>
                        <th class="p-2 text-left">DEPLASMAN</th>
                        <th class="p-2">1Y/0.5</th>
                        <th class="p-2">1Y/1.5</th>
                        <th class="p-2">MS/1.5</th>
                        <th class="p-2">MS/2.5</th>
                        <th class="p-2">MS/3.5</th>
                        <th class="p-2">K/G</th>
                        <th class="p-2">1Y/SKOR</th>
                        <th class="p-2">2Y/SKOR</th>
                        <th class="p-2">SKOR</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-800">
                    <!-- Veriler Buraya Dolacak -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Alt Navigasyon Sekmeleri -->
    <nav class="bg-gray-900 border-t border-gray-800 flex justify-around py-2">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-emerald-400">
            <span class="text-[10px]">Home</span>
        </button>
        <button onclick="switchTab('matches')" class="flex flex-col items-center text-gray-400">
            <span class="text-[10px]">Matches</span>
        </button>
        <button onclick="switchTab('stats')" class="flex flex-col items-center text-gray-400">
            <span class="text-[10px]">Stats</span>
        </button>
        <button onclick="switchTab('account')" class="flex flex-col items-center text-gray-400">
            <span class="text-[10px]">Account</span>
        </button>
    </nav>

    <script>
        const fallbackMatches = [
            { homeTeam: { name: "Cercle Brugge" }, awayTeam: { name: "Antwerp" } },
            { homeTeam: { name: "Lugano" }, awayTeam: { name: "Luzern" } },
            { homeTeam: { name: "Silkeborg" }, awayTeam: { name: "Vejle" } },
            { homeTeam: { name: "KV Mechelen" }, awayTeam: { name: "Gent" } },
            { homeTeam: { name: "Club Tijuana" }, awayTeam: { name: "Atlas" } },
            { homeTeam: { name: "Sporting Kansas" }, awayTeam: { name: "Los Angeles Galaxy" } },
            { homeTeam: { name: "St. Gallen" }, awayTeam: { name: "Lugano" } }
        ];

        function renderTable(matches) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            matches.forEach(match => {
                const home = match.homeTeam.name;
                const away = match.awayTeam.name;
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 border-b border-gray-800";
                tr.innerHTML = `
                    <td class="p-2 text-left font-medium text-gray-200 truncate max-w-[90px]">${home}</td>
                    <td class="p-2 text-left font-medium text-gray-400 truncate max-w-[90px]">${away}</td>
                    <td class="p-1"><span class="bg-emerald-800 text-emerald-200 px-1 py-0.5 rounded text-[9px]">Over</span></td>
                    <td class="p-1"><span class="bg-orange-800 text-orange-200 px-1 py-0.5 rounded text-[9px]">Under</span></td>
                    <td class="p-1"><span class="bg-emerald-800 text-emerald-200 px-1 py-0.5 rounded text-[9px]">Over</span></td>
                    <td class="p-1"><span class="bg-orange-800 text-orange-200 px-1 py-0.5 rounded text-[9px]">Under</span></td>
                    <td class="p-1"><span class="bg-orange-800 text-orange-200 px-1 py-0.5 rounded text-[9px]">Under</span></td>
                    <td class="p-1"><span class="bg-emerald-800 text-emerald-200 px-1 py-0.5 rounded text-[9px]">Yes</span></td>
                    <td class="p-1 text-gray-300">1:0</td>
                    <td class="p-1 text-gray-300">0:1</td>
                    <td class="p-1 text-gray-300">1:1</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('matchTable').classList.remove('hidden');
        }

        // Doğrudan takılmadan açılması için veriyi yüklüyoruz
        renderTable(fallbackMatches);

        function switchTab(tab) {
            alert(tab.toUpperCase() sekmesi aktif.);
        }
    </script>
</body>
</html>
